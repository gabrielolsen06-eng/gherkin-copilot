<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <title>Demo Shop · Cart</title>
</head>
<body data-page="cart">
  <header class="bar">
    <span class="logo">Demo Shop</span>
    <a class="shopping_cart_link" href="cart.html" data-test="shopping-cart-link">Cart <span class="shopping_cart_badge" hidden></span></a>
    <button id="logout" data-test="logout">Log out</button>
  </header>
  <main>
    <h2 class="title" data-test="title">Your Cart</h2>
    <ul class="cart_list"></ul>
    <p class="cart_total" data-test="total"></p>
    <a id="continue-shopping" href="inventory.html">Continue shopping</a>
  </main>
</body>
</html>
