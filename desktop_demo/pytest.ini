[pytest]
# Every scenario in features/ becomes a test (see tests/test_features.py)
bdd_features_base_dir = features
testpaths = tests
# The app under test. Override it for one run with the DESKTOP_APP environment variable.
desktop_app = C:\Windows\System32\charmap.exe
# Only for apps that start through a launcher or splash screen: part of the main window's title
desktop_window =
# Folder to start the app in (default: the .exe's own folder)
desktop_workdir =
