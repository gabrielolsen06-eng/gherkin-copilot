name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, types and security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src tests demo run_demo.py
      - run: mypy
      - run: bandit -q -r src demo run_demo.py
      - run: pip-audit --strict -r requirements.lock

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is where it's developed (and costs 10x the Actions minutes on a private repo)
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned, hash-checked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install gherkin-copilot
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Tool tests
        run: python -m pytest tests -q
      - name: The CLI fails a CI gate on a typo'd path
        shell: bash
        run: |
          set +e
          gherkin-copilot check demo/featurez --path demo
          test $? -eq 2

  demo:
    name: Browser scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Download Playwright's Chromium (CI only; the local demo can use an installed browser)
        run: python -m playwright install --with-deps chromium
      - run: python run_demo.py --no-open
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-report
          path: reports/
