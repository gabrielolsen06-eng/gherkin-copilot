name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, types and security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src tests demo desktop_demo run_demo.py
      - run: mypy
      - run: bandit -q -r src demo desktop_demo run_demo.py
      - run: pip-audit --strict -r requirements.lock -r requirements-desktop.lock

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is where it's developed (and costs 10x the Actions minutes on a private repo)
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned, hash-checked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install gherkin-copilot
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Tool tests
        run: python -m pytest tests -q
      - name: The CLI fails a CI gate on a typo'd path
        shell: bash
        run: |
          set +e
          gherkin-copilot check demo/featurez --path demo
          test $? -eq 2

  demo:
    name: Browser scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Download Playwright's Chromium (CI only; the local demo can use an installed browser)
        run: python -m playwright install --with-deps chromium
      - run: python run_demo.py --no-open
      - name: A project made by `gherkin-copilot init` runs as created
        shell: bash
        run: |
          gherkin-copilot init "$RUNNER_TEMP/starter"
          cd "$RUNNER_TEMP/starter" && python -m pytest -W error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-report
          path: reports/

  edge:
    # The work-laptop path: Windows, the Edge that's already installed, no browser download,
    # and the project's venv used without activating it (PowerShell script policies often block that)
    name: New project on Windows with the installed Edge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # One command per step: a multi-line PowerShell step only fails on its last command's exit code
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: gherkin-copilot init "$env:RUNNER_TEMP\starter"
      - name: Create the project's venv, as its README says
        working-directory: ${{ runner.temp }}/starter
        run: python -m venv .venv
      - name: Install its hash-checked dependencies
        working-directory: ${{ runner.temp }}/starter
        run: .venv\Scripts\python -m pip install --require-hashes -r requirements.lock
      - name: Every scenario line has a step
        working-directory: ${{ runner.temp }}/starter
        run: gherkin-copilot check features
      - name: Run the example in the installed Edge (no `playwright install`)
        working-directory: ${{ runner.temp }}/starter
        run: .venv\Scripts\python -m pytest --browser-channel msedge -W error -v

  desktop:
    # Windows desktop testing: scenarios drive Character Map (on every Windows) through UI Automation
    name: Desktop app scenarios on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.lock -r requirements-desktop.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Every scenario line has a step
        run: gherkin-copilot check desktop_demo/features --path desktop_demo/steps
      - run: mkdir reports
      - name: Run the scenarios against Character Map
        run: python -m pytest desktop_demo -v -p no:cacheprovider --cucumberjson=reports/desktop.json --junitxml=reports/desktop.xml
      - name: Show each failure on the run page
        if: failure()
        shell: python
        env:
          PYTHONIOENCODING: utf-8  # the runner reads annotations as UTF-8
        run: |
          import xml.etree.ElementTree as ET
          for case in ET.parse("reports/desktop.xml").iter("testcase"):
              for bad in [*case.iter("failure"), *case.iter("error")]:
                  text = f"{bad.get('message') or ''}\n{(bad.text or '')[-1500:]}"
                  print(f"::error title={case.get('name')}::" + text.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
      - name: HTML report
        if: always()
        run: gherkin-copilot report reports/desktop.json -o reports/desktop.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-report
          path: reports/

  gitlab:
    # The pipeline `init --ci gitlab` writes, run in the Docker image GitLab would use
    name: GitLab pipeline from init, in Playwright's image
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.63.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Create a project with its GitLab pipeline (the tool is standard-library only, so it runs from source)
        run: PYTHONPATH=src python3 -m gherkin_copilot init /tmp/starter --ci gitlab
      - name: Run the pipeline's script lines exactly as written
        working-directory: /tmp/starter
        run: |
          python3 - > pipeline.sh <<'PY'
          lines = open(".gitlab-ci.yml", encoding="utf-8").read().splitlines()
          for line in lines[lines.index("  script:") + 1:]:
              if not line.startswith("    - "):
                  break
              print(line[6:])
          PY
          cat pipeline.sh
          bash -ex pipeline.sh
      - name: The results GitLab would keep are there
        working-directory: /tmp/starter
        run: test -s reports/junit.xml && test -s reports/cucumber.json
